[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-stack"
version = "0.1.0"
description = "Portable requirements-driven ML research and experiment runtime"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
ml-stack = "ml_stack.cli:main"
ml-stackd = "ml_stack.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
